# This is a sample package test matrix that demonstrates how to configure
# all the different job types for Swift package testing across platforms.
#
# To use this in your workflow, customize the configurations below based on
# your package's requirements.

config:
  # ============================================================================
  # macOS Build Jobs
  # ============================================================================
  # Xcode versions: 16.4, 26.0

  - platform: macOS
    name: macOS Xcode 16.4.0 X86
    runner:
      - macos-15
    xcode_version: "16.4.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift test
    command_arguments: []
    env: {}

  - platform: macOS
    name: macOS Xcode 26.2.0 ARM64
    runner:
      - macos-26
    xcode_version: "26.2.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift test
    command_arguments: []
    env: {}

  # ============================================================================
  # iOS Build Jobs (Build-only)
  # ============================================================================
  # Xcode versions: 16.4, 26.0

  - platform: macOS
    name: iOS Xcode 16.4.0 X86
    runner:
      - macos-15
    xcode_version: "16.4.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift build --build-tests --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
    command_arguments: []
    env: {}

  - platform: macOS
    name: iOS Xcode 26.2.0 ARM64
    runner:
      - macos-26
    xcode_version: "26.2.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift build --build-tests --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
    command_arguments: []
    env: {}

  # ============================================================================
  # Linux Build Jobs
  # ============================================================================
  # Swift versions: 6.0, 6.1, 6.2, nightly-main, nightly-next
  - platform: Linux
    name: Linux Swift 6.0 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.0"
    image: swift:6.0-noble
    setup_command: cd tests/TestPackage
    command: swift test
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift 6.1 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.1"
    image: swift:6.1-noble
    setup_command: cd tests/TestPackage
    command: swift test
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    image: swift:6.2-noble
    setup_command: cd tests/TestPackage
    command: swift test
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    image: swiftlang/swift:nightly-main-noble
    setup_command: cd tests/TestPackage
    command: swift test
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift nightly-next noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    image: swiftlang/swift:nightly-6.3-noble
    setup_command: cd tests/TestPackage
    command: swift test
    command_arguments: []
    env: {}

  # ============================================================================
  # Linux Static SDK Build Jobs
  # ============================================================================
  # Swift versions: 6.2, nightly-main, nightly-next

  - platform: Linux
    name: Static Linux SDK Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    image: swift:6.2-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --static --build-command='cd tests/TestPackage && swift build' 6.2
    command_arguments: []
    env: {}

  - platform: Linux
    name: Static Linux SDK Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    image: swiftlang/swift:nightly-main-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --static --build-command='cd tests/TestPackage && swift build' nightly-main
    command_arguments: []
    env: {}

  - platform: Linux
    name: Static Linux SDK Swift nightly-6.3 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    image: swiftlang/swift:nightly-6.3-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --static --build-command='cd tests/TestPackage && swift build' nightly-6.3
    command_arguments: []
    env: {}

  # ============================================================================
  # Wasm SDK Build Jobs
  # ============================================================================
  # Swift versions: 6.2, nightly-main, nightly-6.next

  - platform: Linux
    name: Wasm SDK Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    image: swift:6.2-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --wasm --build-command='cd tests/TestPackage && swift build' 6.2
    command_arguments: []
    env: {}

  - platform: Linux
    name: Wasm SDK Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    image: swiftlang/swift:nightly-main-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --wasm --build-command='cd tests/TestPackage && swift build' nightly-main
    command_arguments: []
    env: {}

  - platform: Linux
    name: Wasm SDK Swift nightly-next noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-next"
    image: swiftlang/swift:nightly-6.3-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --wasm --build-command='cd tests/TestPackage && swift build' nightly-6.3
    command_arguments: []
    env: {}

  # ============================================================================
  # Embedded Wasm SDK Build Jobs
  # ============================================================================
  # Swift versions: 6.2, nightly-main, nightly-next

  - platform: Linux
    name: Embedded Wasm SDK Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    image: swift:6.2-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --embedded-wasm --build-command='cd tests/TestPackage && swift build' 6.2
    command_arguments: []
    env: {}

  - platform: Linux
    name: Embedded Wasm SDK Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    image: swiftlang/swift:nightly-main-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --embedded-wasm --build-command='cd tests/TestPackage && swift build' nightly-main
    command_arguments: []
    env: {}

  - platform: Linux
    name: Embedded Wasm SDK Swift nightly-next noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    image: swiftlang/swift:nightly-6.3-noble
    setup_command: ""
    command: ./.github/workflows/scripts/install-and-build-with-sdk.sh --embedded-wasm --build-command='cd tests/TestPackage && swift build' nightly-6.3
    command_arguments: []
    env: {}
