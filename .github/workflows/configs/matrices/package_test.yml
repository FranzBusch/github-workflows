# This is a sample package test matrix that demonstrates how to configure
# all the different job types for Swift package testing across platforms.
#
# To use this in your workflow, customize the configurations below based on
# your package's requirements.

config:
  # ============================================================================
  # macOS Build Jobs
  # ============================================================================
  # Default Xcode versions: 16.4, 26.0

  - platform: macOS
    name: macOS Xcode 16.4.0 X86
    runner:
      - macos-15
    xcode_version: "16.4.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift test
    command_arguments: []
    env: {}

  - platform: macOS
    name: macOS Xcode 26.2.0 ARM64
    runner:
      - macos-26
    xcode_version: "26.2.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift test
    command_arguments: []
    env: {}

  # ============================================================================
  # iOS Build Jobs (Build-only)
  # ============================================================================
  # Default Xcode versions: 16.4, 26.0

  - platform: macOS
    name: iOS Xcode 16.4.0 X86
    runner:
      - macos-15
    xcode_version: "16.4.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift build --build-tests --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
    command_arguments: []
    env: {}

  - platform: macOS
    name: iOS Xcode 26.2.0 ARM64
    runner:
      - macos-26
    xcode_version: "26.2.0"
    setup_command: cd tests/TestPackage
    command: xcrun swift build --build-tests --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
    command_arguments: []
    env: {}
