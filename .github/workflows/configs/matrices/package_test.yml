# This is a sample package test matrix that demonstrates how to configure
# all the different job types for Swift package testing across platforms.
#
# To use this in your workflow, customize the configurations below based on
# your package's requirements.

config:
  # ============================================================================
  # macOS Build Jobs
  # ============================================================================
  # Xcode versions: 16.4, 26.0

  - platform: macOS
    name: macOS Xcode 16.4.0 X86
    runner:
      - macos-15
    xcode_version: "16.4.0"
    setup_command: ""
    command: xcrun swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: macOS
    name: macOS Xcode 26.2.0 ARM64
    runner:
      - macos-26
    xcode_version: "26.2.0"
    setup_command: ""
    command: xcrun swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  # ============================================================================
  # iOS Build Jobs
  # ============================================================================
  # Xcode versions: 16.4, 26.0

  - platform: macOS
    name: iOS Xcode 16.4.0 X86
    runner:
      - macos-15
    xcode_version: "16.4.0"
    setup_command: ""
    command: xcrun swift build --build-tests --package-path tests/TestPackage --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
    command_arguments: []
    env: {}

  - platform: macOS
    name: iOS Xcode 26.2.0 ARM64
    runner:
      - macos-26
    xcode_version: "26.2.0"
    setup_command: ""
    command: xcrun swift build --build-tests --package-path tests/TestPackage --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
    command_arguments: []
    env: {}

  # ============================================================================
  # Linux Build Jobs
  # ============================================================================
  # Swift versions: 6.0, 6.1, 6.2, nightly-main, nightly-next
  - platform: Linux
    name: Linux Swift 6.0 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.0"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift 6.1 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.1"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Linux Swift nightly-next noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  # ============================================================================
  # Linux Static SDK Build Jobs
  # ============================================================================
  # Swift versions: 6.2, nightly-main, nightly-next

  - platform: Linux
    name: Static Linux SDK Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    sdk:
      type: static-linux
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Static Linux SDK Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    sdk:
      type: static-linux
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Static Linux SDK Swift nightly-6.3 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    sdk:
      type: static-linux
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  # ============================================================================
  # Wasm SDK Build Jobs
  # ============================================================================
  # Swift versions: 6.2, nightly-main, nightly-next

  - platform: Linux
    name: Wasm SDK Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    sdk:
      type: wasm
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Wasm SDK Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    sdk:
      type: wasm
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Wasm SDK Swift nightly-next noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    sdk:
      type: wasm
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  # ============================================================================
  # Embedded Wasm SDK Build Jobs
  # ============================================================================
  # Swift versions: 6.2, nightly-main, nightly-next

  - platform: Linux
    name: Embedded Wasm SDK Swift 6.2 noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "6.2"
    sdk:
      type: wasm-embedded
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Embedded Wasm SDK Swift nightly-main noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    sdk:
      type: wasm-embedded
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Embedded Wasm SDK Swift nightly-next noble x86_64
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    sdk:
      type: wasm-embedded
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  # ============================================================================
  # Android SDK Build Jobs
  # ============================================================================
  # Swift versions: nightly-main, nightly-next

  - platform: Linux
    name: Android SDK Swift nightly-main NDK r27d
    runner:
      - ubuntu-24.04
    swift_version: "nightly-main"
    sdk:
      type: android
      ndk_version: r27d
      triples:
        - aarch64-unknown-linux-android28
        - x86_64-unknown-linux-android28
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Linux
    name: Android SDK Swift nightly-next NDK r27d
    runner:
      - ubuntu-24.04
    swift_version: "nightly-6.3"
    sdk:
      type: android
      ndk_version: r27d
      triples:
        - aarch64-unknown-linux-android28
        - x86_64-unknown-linux-android28
    setup_command: ""
    command: swift build --package-path tests/TestPackage
    command_arguments: []
    env: {}

  # ============================================================================
  # Windows Build Jobs
  # ============================================================================
  # Swift versions: 6.2, nightly-main, nightly-next

  - platform: Windows
    name: Windows Swift 6.2
    runner:
      - windows-2022
    swift_version: "6.2"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Windows
    name: Windows Swift nightly-main
    runner:
      - windows-2022
    swift_version: "nightly-main"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}

  - platform: Windows
    name: Windows Swift nightly-next
    runner:
      - windows-2022
    swift_version: "nightly-6.3"
    setup_command: ""
    command: swift test --package-path tests/TestPackage
    command_arguments: []
    env: {}
