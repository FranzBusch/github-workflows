name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  load-package-test-matrix:
    name: Load package test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_yaml: ${{ steps.load.outputs.matrix_yaml }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Load matrix YAML
        id: load
        run: |
          matrix_yaml=$(cat .github/workflows/configs/matrices/package_test.yml)
          echo "matrix_yaml<<EOF" >> $GITHUB_OUTPUT
          echo "$matrix_yaml" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  package-test:
    name: Package Test
    needs: load-package-test-matrix
    uses: ./.github/workflows/execute_matrix.yml
    with:
      name: package-test
      matrix_yaml_string: ${{ needs.load-package-test-matrix.outputs.matrix_yaml }}
      job_timeout: 60
      needs_token: false
